services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kgi-knowledge-shredder-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-knowledge_shredder}
      POSTGRES_USER: ${POSTGRES_USER:-kgi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgi}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
