server:
  port: 8080

spring:
  application:
    name: knowledge-shredder
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/knowledge_shredder}
    username: ${DATABASE_USERNAME:kgi}
    password: ${DATABASE_PASSWORD:kgi}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_STAGE1_MODEL:qwen2.5:7b}
          temperature: 0.1
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: ${OPENAI_STAGE2_MODEL:gpt-4o}
    vectorstore:
      pgvector:
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 1536
        initialize-schema: false
        table-name: document_embeddings

kgi:
  ai:
    embedding-model: ${KGI_EMBEDDING_MODEL:text-embedding-3-small}
    embedding-dimensions: ${KGI_EMBEDDING_DIMENSIONS:1536}
    rag-top-k-default: ${KGI_RAG_TOP_K_DEFAULT:5}
  security:
    dev-trainer-id: ${KGI_DEV_TRAINER_ID:learner_001}
    issuer-uri: ${KGI_JWT_ISSUER_URI:}
    jwk-set-uri: ${KGI_JWT_JWK_SET_URI:}
    audience: ${KGI_JWT_AUDIENCE:knowledge-shredder}
    trainer-claim: ${KGI_JWT_TRAINER_CLAIM:trainer_id}
  checkpoint:
    enabled: ${KGI_CHECKPOINT_ENABLED:true}
    min-score-to-pass: ${KGI_CHECKPOINT_MIN_SCORE:0.75}
    model-a: ${KGI_MODEL_A:openai}
    model-b: ${KGI_MODEL_B:openai-gpt}
  chunking:
    chunk-size-tokens: ${KGI_CHUNK_SIZE_TOKENS:600}
  async:
    core-pool-size: ${KGI_ASYNC_CORE_POOL_SIZE:4}
    max-pool-size: ${KGI_ASYNC_MAX_POOL_SIZE:10}
  retention:
    soft-delete-retention-days: ${KGI_SOFT_DELETE_RETENTION_DAYS:365}

management:
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  endpoints:
    web:
      exposure:
        include: health,info,metrics,readiness,liveness
